<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Powerlifting RAW — Сила</title>
<style>
  :root{
    --bg: #0a0c15;
    --panel: #141824;
    --panel2: #1a2030;
    --line: #2a3050;
    --ink: #ffffff;
    --muted: #b8c4e0;
    --accent: #e8a33d;
    --accent2: #4a90d9;
    --green: #3cb371;
    --red: #d9534f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: #ffffff;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-overflow-scrolling: touch;
  }
  header{
    padding: 18px 16px 10px; text-align:center; position:sticky; top:0; z-index:10;
    background: linear-gradient(180deg, #0a0c15 80%, transparent);
  }
  header h1{
    margin:0; font-size: 1.8rem; letter-spacing:.5px;
    font-family: Georgia, 'Times New Roman', serif;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    font-weight: 700;
  }
  header h1 .emoji-btn {
    cursor: pointer;
    display: inline-block;
    transition: all 0.2s;
    user-select: none;
    position: relative;
  }
  header h1 .emoji-btn:hover {
    transform: scale(1.3);
    text-shadow: 0 0 30px rgba(232,163,61,0.6);
  }
  header h1 .emoji-btn:active {
    transform: scale(0.85);
  }
  header .sub{ 
    color: #d8ddf0; 
    font-size: 1rem; 
    margin-top:6px;
    font-weight: 400;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .week-bar{
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap;
    padding: 8px 12px 14px;
  }
  .week-bar button{
    background:var(--panel); border:1px solid var(--line); color: #d8ddf0;
    padding:8px 14px; border-radius:8px; font-size:.85rem; cursor:pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .week-bar button:hover{
    background: var(--panel2);
    border-color: var(--accent2);
    color: #ffffff;
  }
  .week-bar button.active{
    background: var(--accent); color:#1a1208; border-color:var(--accent); font-weight:700;
  }

  nav.days{
    display:flex; gap:8px; padding: 0 12px 12px; justify-content:center;
  }
  nav.days button{
    flex:1; max-width:160px; background:var(--panel2); border:1px solid var(--line);
    color:#d8ddf0; padding:12px 8px; border-radius:10px; font-size:.9rem; cursor:pointer;
    font-weight:600;
    transition: all 0.2s;
  }
  nav.days button:hover{
    background: var(--panel);
    border-color: var(--accent);
    color: #ffffff;
  }
  nav.days button.active{
    background: linear-gradient(135deg,#2a3a5c,#1d2130); border-color: var(--accent2);
    box-shadow: 0 0 0 2px var(--accent2) inset;
    color: #ffffff;
  }

  main{ max-width: 720px; margin: 0 auto; padding: 0 12px 16px; }

  .group-label{
    margin: 22px 0 10px; font-size:.8rem; letter-spacing:1.5px; text-transform:uppercase;
    color: var(--accent); display:flex; align-items:center; gap:6px;
    font-weight: 600;
  }
  .group-label hr{ flex:1; border:none; border-top:2px solid var(--line);}

  .card{
    background: var(--panel); border:1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card.done{ opacity:.5; }
  .card-top{ display:flex; align-items:flex-start; gap:12px; }
  .chk{
    width:24px; height:24px; border-radius:6px; border:2px solid var(--muted);
    flex:0 0 auto; cursor:pointer; display:flex; align-items:center; justify-content:center;
    margin-top:2px;
    color: var(--ink);
    transition: all 0.2s;
    font-size: 1.1rem;
    font-weight: bold;
  }
  .chk:hover{
    border-color: var(--accent);
    background: rgba(232,163,61,0.1);
  }
  .chk.checked{ background:var(--green); border-color:var(--green); color:#0a0c15; font-weight:bold;}
  
  .ex-name{ 
    font-weight:700; 
    font-size:1.05rem; 
    color: #ffffff; 
    margin-bottom: 2px;
  }
  .ex-meta{ 
    color: #b8c4e0; 
    font-size:.85rem; 
    margin-top:2px;
    font-weight: 400;
  }
  .ex-note{
    color: var(--accent2);
    font-size:.75rem;
    margin-top:2px;
    font-style: italic;
  }
  
  .ex-status {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .ex-status.done {
    background: var(--green);
    box-shadow: 0 0 12px rgba(60, 179, 113, 0.5);
  }
  .ex-status.partial {
    background: var(--accent);
    box-shadow: 0 0 12px rgba(232, 163, 61, 0.5);
  }
  .ex-status.empty {
    background: var(--line);
  }

  .day-progress {
    background: var(--panel2);
    border-radius: 10px;
    padding: 8px 14px;
    margin: 10px 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--line);
  }
  .day-progress .bar {
    flex: 1;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .day-progress .bar .fill {
    height: 100%;
    background: var(--green);
    border-radius: 3px;
    transition: width 0.3s;
    width: 0%;
  }
  .day-progress .text {
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
    font-weight: 500;
  }
  .day-progress .text b {
    color: var(--ink);
  }

  .week-progress-line{
    color: #7ab8ff; 
    font-size:.75rem; 
    margin-top:6px; 
    line-height:1.6;
    word-spacing: 3px;
    background: rgba(74, 144, 217, 0.08);
    padding: 4px 8px;
    border-radius: 6px;
  }
  .cur-week{ 
    color: var(--accent); 
    font-weight: 700;
    font-size: .85rem;
    background: rgba(232,163,61,0.2);
    padding: 1px 6px;
    border-radius: 4px;
  }

  .actions{ margin-left:auto; display:flex; gap:8px; flex:0 0 auto; }
  .icon-btn{
    background:var(--panel2); border:1px solid var(--line); color:#d8ddf0;
    border-radius:8px; padding:8px 12px; font-size:.85rem; cursor:pointer; text-decoration:none;
    white-space:nowrap;
    transition: all 0.2s;
    font-weight: 500;
  }
  .icon-btn:hover{ 
    border-color:var(--accent2); 
    color: #ffffff;
    background: var(--panel);
    transform: scale(1.05);
  }

  .sets-row{ 
    display:grid; 
    grid-template-columns: repeat(6, 1fr);
    gap:6px; 
    margin-top:12px; 
  }
  .set-input{
    display:flex; flex-direction:column; gap:3px;
  }
  .set-input label{ 
    font-size:.6rem; 
    color: #b8c4e0;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-align:center;
  }
  .set-input input{
    width:100%; background: #0d0f1a; border:1px solid var(--line); color: #ffffff;
    border-radius:6px; padding:6px 4px; font-size:.8rem; text-align:center;
    transition: all 0.2s;
    font-weight: 500;
  }
  .set-input input:focus{ 
    outline:none; 
    border-color:var(--accent2);
    box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.25);
    background: #131625;
  }
  .set-input input::placeholder{
    color: #6a7290;
    font-weight: 400;
    font-size: 0.6rem;
  }

  .last-log{
    margin-top:10px; font-size:.85rem; color: #d8ddf0;
    background: #0d0f1a; border-radius:8px; padding:8px 12px; border:1px solid var(--line);
  }
  .last-log b{ color: var(--green); font-weight: 700; }

  .alt-select{
    width:100%; background: #0d0f1a; border:1px solid var(--line);
    color: #b8c4e0; border-radius:6px;
    font-size:.85rem; padding:6px 10px; margin-top:8px;
    cursor:pointer; outline:none;
    -webkit-appearance:none; appearance:none;
    transition: all 0.2s;
  }
  .alt-select:focus{ 
    border-color:var(--accent); 
    color:#ffffff;
    box-shadow: 0 0 0 2px rgba(232,163,61,0.15);
  }
  .alt-select option{ 
    background:var(--panel); 
    color:#ffffff;
    padding: 4px;
  }
  .alt-select optgroup{
    background:var(--panel);
    color: var(--accent);
    font-weight: 700;
    font-size: .85rem;
    padding: 4px 0;
  }
  .alt-select optgroup option{
    padding-left: 12px;
    font-weight: 400;
    color: #d8ddf0;
  }

  .note-box{
    background: rgba(232,163,61,.1); border:1px solid rgba(232,163,61,.25);
    border-radius:10px; padding:12px 16px; font-size:.85rem; color: #e8d5a8; margin: 16px 0;
    line-height: 1.6;
  }
  .cardio-box{
    background: rgba(60,179,113,.1); border:1px solid rgba(60,179,113,.25);
    border-radius:10px; padding:12px 16px; font-size:.85rem; color: #a8e0c0; margin: 8px 0 16px;
    line-height: 1.6;
  }

  /* ===== КНОПКИ В КІНЦІ КОНТЕНТУ ===== */
  .bottom-bar {
    max-width: 720px;
    margin: 0 auto;
    padding: 8px 12px 16px;
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    border-top: 1px solid var(--line);
    margin-top: 8px;
  }
  .bottom-btn {
    background: var(--panel2);
    border: 1px solid var(--line);
    color: #6a7290;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    font-family: inherit;
    line-height: 1.2;
    flex: 0 1 auto;
    min-width: 48px;
    justify-content: center;
  }
  .bottom-btn:hover {
    border-color: var(--accent2);
    color: #ffffff;
    background: var(--panel);
    transform: scale(1.05);
  }
  .bottom-btn:active {
    transform: scale(0.9);
  }
  .bottom-btn .label {
    font-size: 0.5rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.2px;
    text-transform: uppercase;
  }
  .bottom-btn:hover .label {
    color: #ffffff;
  }
  .bottom-btn.save-btn {
    border-color: rgba(232,163,61,0.3);
    color: var(--accent);
  }
  .bottom-btn.save-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .bottom-btn.resend-btn {
    border-color: rgba(74,144,217,0.3);
    color: var(--accent2);
  }
  .bottom-btn.resend-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }
  .bottom-btn.clear-btn {
    border-color: rgba(217,83,79,0.3);
    color: var(--red);
  }
  .bottom-btn.clear-btn:hover {
    border-color: var(--red);
    color: var(--red);
  }
  .bottom-btn.import-btn {
    border-color: rgba(60,179,113,0.3);
    color: var(--green);
  }
  .bottom-btn.import-btn:hover {
    border-color: var(--green);
    color: var(--green);
  }
  .bottom-btn.sync-btn {
    border-color: rgba(232,163,61,0.2);
    color: #7ab8ff;
  }
  .bottom-btn.sync-btn:hover {
    border-color: #7ab8ff;
    color: #7ab8ff;
  }

  .toast{
    position: fixed; bottom: 80px; left:50%; transform:translateX(-50%);
    background: var(--green); color:#0a0c15; padding:12px 24px; border-radius:12px;
    font-size:1rem; font-weight:700; opacity:0; transition:opacity .3s; pointer-events:none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    z-index: 200;
  }
  .toast.show{ opacity:1; }

  .icon-btn.save-ex{ color: var(--accent); border-color: rgba(232,163,61,.3); }
  .icon-btn.save-ex:hover{ 
    border-color: var(--accent);
    color: var(--accent);
  }
  .icon-btn.save-ex.saved{ color: var(--green); border-color: rgba(60,179,113,.3); }
  .icon-btn.cal-btn{ color: var(--accent2); }
  .icon-btn.cal-btn:hover{ color: #7ab8ff; }

  .modal-overlay{
    position: fixed; inset:0; background: rgba(0,0,0,.8); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    background: var(--panel); border:1px solid var(--line); border-radius: 16px 16px 0 0;
    width:100%; max-width: 720px; max-height: 78vh; overflow-y:auto; padding: 20px 20px 28px;
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h3{ 
    margin:0; 
    font-size:1.1rem; 
    color: #ffffff;
    font-weight: 700;
  }
  .modal-close{
    background:var(--panel2); border:1px solid var(--line); color:#d8ddf0;
    border-radius:8px; width:36px; height:36px; cursor:pointer; font-size:1.2rem;
    transition: all 0.2s;
    font-weight: bold;
  }
  .modal-close:hover{
    border-color: var(--red);
    color: #ffffff;
    background: rgba(217, 83, 79, 0.1);
  }
  .hist-row{
    display:flex; justify-content:space-between; gap:12px; padding:10px 14px;
    background: #0d0f1a; border-radius:8px; margin-bottom:8px; font-size:.9rem;
  }
  .hist-row .hd{ color: #b8c4e0; flex:0 0 auto; font-weight: 500; }
  .hist-row .hv{ color: #ffffff; text-align:right; font-weight: 600; }
  .hist-empty{ color:#b8c4e0; font-size:.9rem; text-align:center; padding: 24px 0; }

  .profile-bar{
    display:flex; gap:10px; justify-content:center; padding: 6px 12px 12px;
  }
  .profile-bar button{
    background:var(--panel2); border:1px solid var(--line); color:#b8c4e0;
    padding:10px 22px; border-radius:10px; font-size:.9rem; cursor:pointer; font-weight:600;
    transition: all 0.2s;
  }
  .profile-bar button:hover{
    border-color: var(--accent);
    color: #ffffff;
    background: var(--panel);
  }
  .profile-bar button.active{
    background: linear-gradient(135deg,#3a2a1a,#1d2130); border-color: var(--accent);
    color: #ffffff; box-shadow: 0 0 0 2px var(--accent) inset;
  }

  @media (max-width: 480px) {
    .sets-row { 
      grid-template-columns: repeat(3, 1fr);
    }
    header h1 { font-size: 1.4rem; }
    .bottom-btn { padding: 4px 8px; font-size: 0.85rem; min-width: 38px; }
    .bottom-btn .label { font-size: 0.4rem; }
    .bottom-bar { padding: 6px 8px 12px; gap: 4px; }
  }
</style>

<body>

<header>
  <h1 id="appTitle">
    <span onclick="clearCacheAndReload()" class="emoji-btn" title="Натисніть для оновлення кешу">
      🏋️
    </span>
    Powerlifting RAW
  </h1>
  <div class="sub" id="appSub">Силова програма • 4-6 повторень</div>
</header>

<div class="profile-bar" id="profileBar"></div>
<div class="week-bar" id="weekBar"></div>
<nav class="days" id="dayNav"></nav>

<main id="main"></main>

<!-- ===== КНОПКИ В КІНЦІ КОНТЕНТУ ===== -->
<div class="bottom-bar">
  <button id="saveBtn" class="bottom-btn save-btn" title="Зберегти тренування">
    💾 <span class="label">зберегти</span>
  </button>
  <button id="resendBtn" class="bottom-btn resend-btn" title="Перевідправити звіт">
    🔄 <span class="label">перевідпр.</span>
  </button>
  <button id="clearBtn" class="bottom-btn clear-btn" title="Очистити поля">
    🗑 <span class="label">очистити</span>
  </button>
  <button id="importBtn" class="bottom-btn import-btn" title="Завантажити план" onclick="document.getElementById('xlsxInput').click()">
    📂 <span class="label">завантажити</span>
  </button>
  <button id="syncHistoryBtn" class="bottom-btn sync-btn" title="Підвантажити історію з Telegram">
    📥 <span class="label">історія</span>
  </button>
  <input type="file" id="xlsxInput" accept=".xlsx" style="display:none">
</div>

<div class="toast" id="toast">Збережено!</div>
<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
// ===== СИСТЕМА ВЕРСІОНУВАННЯ =====
(function() {
  const today = new Date().toISOString().slice(0,10);
  let version = localStorage.getItem('app_version');
  let versionDate = version ? version.split('-')[0] : '';
  
  if (!version || versionDate !== today) {
    version = today + '-' + Math.random().toString(36).substr(2, 6);
    localStorage.setItem('app_version', version);
  }
  
  document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
    if (link.href && !link.href.includes('v=')) {
      link.href += (link.href.includes('?') ? '&' : '?') + 'v=' + version;
    }
  });
  
  document.querySelectorAll('script[src]').forEach(script => {
    if (script.src && !script.src.includes('v=') && !script.src.includes('xlsx')) {
      script.src += (script.src.includes('?') ? '&' : '?') + 'v=' + version;
    }
  });
  
  const manifest = document.querySelector('link[rel="manifest"]');
  if (manifest && manifest.href && !manifest.href.includes('v=')) {
    manifest.href += (manifest.href.includes('?') ? '&' : '?') + 'v=' + version;
  }
})();

function clearCacheAndReload() {
  if (confirm('🔄 Очистити кеш і перезавантажити сторінку?')) {
    const today = new Date().toISOString().slice(0,10);
    const newVersion = today + '-' + Math.random().toString(36).substr(2, 6);
    localStorage.setItem('app_version', newVersion);
    const url = new URL(window.location.href);
    url.searchParams.set('v', newVersion);
    window.location.href = url.href;
  }
}

// ===== ВСІ ВПРАВИ =====

const ONERM = {
  'Жим штанги лежачи (головна вправа для сили грудей)': 104.5,
  'Підйом штанги на біцепс (головна вправа для сили рук)': 70,
  'Шраги зі штангою (основна вправа для трапеції)': 180,
};
const PCT_BY_WEEK = {1:0.60,2:0.70,3:0.75,4:0.65,5:[0.77,0.80],6:[0.72,0.75],7:[0.80,0.82],8:0.65};

function round25(x){ return Math.round(x/2.5)*2.5; }
function targetWeight(name, week){
  if(profile !== 'man') return null;
  if(!ONERM[name]) return null;
  const pct = PCT_BY_WEEK[week];
  const onerm = ONERM[name];
  if(Array.isArray(pct)){
    const lo = round25(onerm*pct[0]), hi = round25(onerm*pct[1]);
    return lo===hi ? `${lo} кг` : `${lo}–${hi} кг`;
  }
  return `${round25(onerm*pct)} кг`;
}

function ytUrl(name){
  const clean = name.split(' (')[0];
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(clean + ' техніка виконання');
}

function weeklyProgressionLine(it){
  const name = it.name;
  if(profile === 'man'){
    if(ONERM[name]){
      const parts = [];
      for(let w=1; w<=8; w++){
        const pct = PCT_BY_WEEK[w];
        const onerm = ONERM[name];
        let val;
        if(Array.isArray(pct)){
          const lo = round25(onerm*pct[0]), hi = round25(onerm*pct[1]);
          val = lo===hi ? `${lo}` : `${lo}-${hi}`;
        }else{
          val = `${round25(onerm*pct)}`;
        }
        parts.push(`Т${w}:${val}`);
      }
      return { text: '⚖️ ' + parts.join('  ') + ' кг', highlightWeek: true };
    }
    return null;
  }
  return null;
}

let profile = localStorage.getItem('trenuvannya-profile') || 'man';

// ===== ЗБЕРІГАННЯ ДАНИХ =====
const STORAGE_PREFIX = 'trenuvannya_';

function getStorageKey(profileType, key) {
  return STORAGE_PREFIX + profileType + '_' + key;
}

function saveAllData(profileType) {
  try {
    localStorage.setItem(getStorageKey(profileType, 'pendingSets'), JSON.stringify(pendingSets));
    localStorage.setItem(getStorageKey(profileType, 'checkedState'), JSON.stringify(checkedState));
    localStorage.setItem(getStorageKey(profileType, 'savedThisSession'), JSON.stringify(savedThisSession));
    localStorage.setItem(getStorageKey(profileType, 'currentDay'), String(currentDay));
    localStorage.setItem(getStorageKey(profileType, 'currentWeek'), String(currentWeek));
  } catch(e) { console.error('Save error:', e); }
}

function loadAllData(profileType) {
  try {
    const pending = localStorage.getItem(getStorageKey(profileType, 'pendingSets'));
    if (pending) pendingSets = JSON.parse(pending);
    else pendingSets = {};
    
    const checked = localStorage.getItem(getStorageKey(profileType, 'checkedState'));
    if (checked) checkedState = JSON.parse(checked);
    else checkedState = {};
    
    const saved = localStorage.getItem(getStorageKey(profileType, 'savedThisSession'));
    if (saved) savedThisSession = JSON.parse(saved);
    else savedThisSession = {};
    
    const day = localStorage.getItem(getStorageKey(profileType, 'currentDay'));
    if (day) currentDay = parseInt(day);
    else currentDay = 0;
    
    const week = localStorage.getItem(getStorageKey(profileType, 'currentWeek'));
    if (week) currentWeek = parseInt(week);
    else currentWeek = 1;
  } catch(e) { 
    console.error('Load error:', e);
    pendingSets = {};
    checkedState = {};
    savedThisSession = {};
    currentDay = 0;
    currentWeek = 1;
  }
}

function exId(dayId, name){ return dayId + '::' + name; }

const hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function storageGet(key){
  if(hasClaudeStorage){
    try{
      const res = await window.storage.get(key);
      return res ? res.value : null;
    }catch(e){ return null; }
  }
  return localStorage.getItem(key);
}
async function storageSet(key, value){
  if(hasClaudeStorage){
    try{ await window.storage.set(key, value); return; }catch(e){ /* fall through */ }
  }
  localStorage.setItem(key, value);
}

async function loadLastLogs(){
  for(const day of getDays()){
    for(const g of day.groups){
      for(const it of g.items){
        const id = exId(day.id, it.name);
        const raw = await storageGet('lastlog:'+id);
        if(raw){
          try{ 
            const parsed = JSON.parse(raw);
            if (parsed && parsed.sets && Array.isArray(parsed.sets)) {
              lastLogs[id] = parsed;
            }
          }catch(e){ /* ignore bad data */ }
        }
      }
    }
  }
}

function fmtLast(log){
  if(!log || !log.sets) return null;
  const sets = log.sets.filter(s=>s.w && s.r).map(s=> `${s.w}/${s.r}`).join(', ');
  return `${sets}`;
}

// ===== СТАТУС ВПРАВ =====
function checkExerciseStatus(id) {
  const sets = pendingSets[id] || [];
  const filledCount = sets.filter(s => s.raw && s.raw.trim() !== '').length;
  
  if (filledCount >= 6) return 'done';
  if (filledCount > 0) return 'partial';
  return 'empty';
}

function getDayProgress(day) {
  let total = 0;
  let done = 0;
  
  for (const g of day.groups) {
    for (const it of g.items) {
      total++;
      const id = exId(day.id, it.name);
      const status = checkExerciseStatus(id);
      if (status === 'done' || status === 'partial') done++;
    }
  }
  
  return { total, done, percent: total > 0 ? Math.round((done / total) * 100) : 0 };
}

const TG_QUEUE_KEY = 'tg-queue-v2';

function getTgQueue(){
  try{ return JSON.parse(localStorage.getItem(TG_QUEUE_KEY) || '[]'); }catch(e){ return []; }
}
function setTgQueue(q){
  try{ localStorage.setItem(TG_QUEUE_KEY, JSON.stringify(q)); }catch(e){ }
}
function getSentDates(){
  try{ return JSON.parse(localStorage.getItem(TG_SENT_KEY) || '{}'); }catch(e){ return {}; }
}
function markSent(sentKey){
  const s = getSentDates();
  s[sentKey] = Date.now();
  try{ localStorage.setItem(TG_SENT_KEY, JSON.stringify(s)); }catch(e){ }
}
function alreadySent(sentKey){

}
function clearSent(sentKey){

  try{ localStorage.setItem(TG_SENT_KEY, JSON.stringify(s)); }catch(e){ }
}

function queueTelegramMessages(texts, sentKey, chatIds){
  const q = getTgQueue();
  q.push({ texts, sentKey, chatIds, ts: Date.now() });
  if(q.length > 100) q.splice(0, q.length - 100);
  setTgQueue(q);
}

async function sendToTelegram(chatId, text){
  const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      chat_id: chatId,
      text: text,
      parse_mode: 'HTML'
    })
  });
  
  if (!response.ok) {
    const error = await response.text();
    throw new Error(`Telegram API error: ${response.status} - ${error}`);
  }
  return response.json();
}

async function sendToChats(text, chatIds){
  const results = await Promise.allSettled(
    chatIds.map(chatId => sendToTelegram(chatId, text))
  );
  
  const failed = results.filter(r => r.status === 'rejected');
  if (failed.length > 0) {
    console.warn(`❌ Не вдалося відправити в ${failed.length} чатів`);
    throw new Error(`Failed to send to ${failed.length} chats`);
  }
  return results;
}

let tgFlushing = false;
async function flushTelegramQueue(){
  if(tgFlushing) return;
  tgFlushing = true;
  try{
    let q = getTgQueue();
    while(q.length){
      const item = q[0];
      try{
        const textList = Array.isArray(item.texts) ? item.texts : [item.texts || item.text];
        const chatIds = item.chatIds || [CHAT_ID_MAIN];
        for(const t of textList){
          await sendToChats(t, chatIds);
        }
        if(item.sentKey) markSent(item.sentKey);
        q.shift();
        setTgQueue(q);
      }catch(e){ 
        console.warn('⏳ Черга тимчасово недоступна, спробуємо пізніше:', e.message);
        break;
      }
    }
  } finally { 
    tgFlushing = false; 
  }
}

// ===== СТАТИСТИКА =====
function calcStats(allSets, day){
  let totalTonnage = 0;
  let totalSets = 0;
  let totalExercises = 0;
  const records = [];

  for(const g of day.groups){
    for(const it of g.items){
      const sets = allSets[it.name];
      if(!sets || !sets.length) continue;
      totalExercises++;
      for(const s of sets){
        totalSets++;
        const w = parseFloat(s.w);
        const r = parseFloat(s.r);
        if(!isNaN(w) && !isNaN(r)) totalTonnage += w * r;
      }
      const id = exId(day.id, it.name);
      const hist = [];
      try{
        const raw = localStorage.getItem('history:' + id);
        if(raw) hist.push(...JSON.parse(raw));
      }catch(e){}
      const today = new Date().toISOString().slice(0,10);
      let bestPrev = 0;
      for(const entry of hist){
        if(entry.date === today) continue;
        for(const s of (entry.sets||[])){
          const w = parseFloat(s.w), r = parseFloat(s.r);
          if(!isNaN(w) && !isNaN(r)){
            const e1rm = w * (1 + r/30);
            if(e1rm > bestPrev) bestPrev = e1rm;
          }
        }
      }
      let todayBest = 0; let todayBestW = 0; let todayBestR = 0;
      for(const s of sets){
        const w = parseFloat(s.w), r = parseFloat(s.r);
        if(!isNaN(w) && !isNaN(r)){
          const e1rm = w * (1 + r/30);
          if(e1rm > todayBest){ todayBest = e1rm; todayBestW = w; todayBestR = r; }
        }
      }
      if(todayBest > 0 && todayBest > bestPrev && bestPrev > 0){
        records.push(`🏆 Рекорд: ${it.name} — ${todayBestW}×${todayBestR}`);
      }
    }
  }
  return { totalTonnage: Math.round(totalTonnage), totalSets, totalExercises, records };
}

function buildWorkoutMessage(day, today, numberedLines, stats){
  const profileLabel = '🙋‍♂️ Чоловік';
  const weekTxt = `  •  Тиж.${currentWeek}`;
  let msg = `🏋 ${profileLabel} — ${day.label}${weekTxt}\n📅 ${today}\n`;
  msg += '─'.repeat(30) + '\n';
  msg += numberedLines.join('\n');
  msg += '\n' + '─'.repeat(30) + '\n';
  msg += `📊 Підсумок:\n`;
  msg += `💪 Вправ: ${stats.totalExercises}\n`;
  msg += `🔢 Підходів: ${stats.totalSets}\n`;
  if(stats.totalTonnage > 0) msg += `📈 Тоннаж: ${stats.totalTonnage} кг\n`;
  if(stats.records.length){
    msg += '\n' + stats.records.join('\n') + '\n';
  }
  return msg;
}

async function logExercise(id, log){
  lastLogs[id] = log;
  await storageSet('lastlog:'+id, JSON.stringify(log));
  let hist = [];
  const h = await storageGet('history:'+id);
  if(h){
    try{ hist = JSON.parse(h); }catch(e){ hist = []; }
  }
  hist.push(log);
  if(hist.length>30) hist = hist.slice(-30);
  await storageSet('history:'+id, JSON.stringify(hist));
}

function setsFromPending(id){
  return (pendingSets[id]||[]).map(s=>{
    if(!s.raw) return {w:'',r:''};
    const parts = s.raw.split('/');
    return {w: parts[0]?.trim()||'', r: parts[1]?.trim()||''};
  }).filter(s=>s.w || s.r);
}

async function sendWorkoutReport(force = false){
  const day = getDays()[currentDay];
  const today = new Date().toISOString().slice(0,10);
  const sentKey = `${profile}::${day.id}::${today}`;

  if(!force && alreadySent(sentKey)){
    showToast('Звіт за сьогодні вже відправлено в Telegram');
    return false;
  }

  if(force){
    clearSent(sentKey);
  }

  let any = false;
  let num = 1;
  const numberedLines = [];
  const allSets = {};
  for(const g of day.groups){
    for(const it of g.items){
      const id = exId(day.id, it.name);
      const sets = setsFromPending(id);
      if(sets.length){
        any = true;
        try{
          await logExercise(id, {date: today, sets});
          savedThisSession[id] = true;
          const setsTxt = sets.map(s=>`${s.w||'-'}/${s.r||'-'}`).join(' | ');
          const altText = (pendingSets[id+'::alt'] || {}).raw || '';
          const nameLine = altText ? `${it.name} → ${altText}` : it.name;
          numberedLines.push(`${num}. ${nameLine}\n   ${setsTxt}`);
          num++;
          allSets[it.name] = sets;
        }catch(e){ console.error('storage error', e); }
      }
    }
  }
  
  if(any){
    const stats = calcStats(allSets, day);
    const text = buildWorkoutMessage(day, today, numberedLines, stats);
    
    const chatIds = [CHAT_ID_MAIN];
    
    queueTelegramMessages([text], sentKey, chatIds);
    flushTelegramQueue();
    showToast(force ? '🔄 Звіт перевідправлено!' : 'Тренування збережено і відправлено!');
    if(!force) renderMain();
    return true;
  } else {
    showToast('Немає даних для збереження');
    return false;
  }
}

// ===== СИНХРОНІЗАЦІЯ =====
async function syncHistoryFromTelegram() {
  showToast('⏳ Завантаження історії з Telegram...');
  
  try {
    const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/getUpdates`;
    const response = await fetch(url, {
      method: 'GET',
      headers: { 'Content-Type': 'application/json' }
    });
    
    if (!response.ok) {
      throw new Error('Помилка отримання даних з Telegram');
    }
    
    const data = await response.json();
    if (!data.ok) {
      throw new Error(data.description || 'Помилка Telegram API');
    }
    
    let parsedCount = 0;
    const results = data.result || [];
    
    for (const update of results) {
      const msg = update.message || update.edited_message;
      if (!msg || !msg.text) continue;
      
      const text = msg.text;
      const workoutMatch = text.match(/🏋\s*🙋‍♂️ Чоловік\s*[—\-]\s*(День\s*\d+)/i);
      if (!workoutMatch) continue;
      
      const dayMatch = workoutMatch[1].match(/День\s*(\d+)/i);
      if (!dayMatch) continue;
      
      const dayNum = parseInt(dayMatch[1]);
      const date = new Date(msg.date * 1000).toISOString().slice(0,10);
      
      const lines = text.split('\n');
      let currentExercise = null;
      let sets = [];
      
      for (const line of lines) {
        const exMatch = line.match(/^(\d+)\.\s*(.+?)(?:\s*→\s*(.+))?$/);
        if (exMatch) {
          if (currentExercise && sets.length > 0) {
            const id = `d${dayNum}::${currentExercise}`;
            await storageSet('lastlog:' + id, JSON.stringify({ date, sets: sets }));
            parsedCount++;
          }
          
          currentExercise = exMatch[2].trim();
          sets = [];
          continue;
        }
        
        const setsMatch = line.match(/^\s*([\d\-/]+\s*\|?\s*)+$/);
        if (setsMatch && currentExercise) {
          const parts = line.trim().split('|').map(s => s.trim());
          for (const part of parts) {
            const values = part.split('/');
            if (values.length === 2) {
              const w = values[0].trim();
              const r = values[1].trim();
              if (w && r && !isNaN(w) && !isNaN(r)) {
                sets.push({ w, r });
              }
            }
          }
        }
      }
      
      if (currentExercise && sets.length > 0) {
        const id = `d${dayNum}::${currentExercise}`;
        await storageSet('lastlog:' + id, JSON.stringify({ date, sets: sets }));
        parsedCount++;
      }
    }
    
    await loadLastLogs();
    renderAll();
    showToast(`✅ Завантажено ${parsedCount} записів з Telegram!`);
    
  } catch (error) {
    console.error('Sync error:', error);
    showToast('❌ Помилка синхронізації: ' + error.message);
  }
}

document.getElementById('syncHistoryBtn').onclick = syncHistoryFromTelegram;

// ===== ІМПОРТ EXCEL =====
function importXlsx(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});

      function parseSheet(sheetName){
        const ws = wb.Sheets[sheetName];
        if(!ws) return null;
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
        let headerRow = -1;
        for(let i=0; i<rows.length; i++){
          if(String(rows[i][0]).toLowerCase().includes('день')){
            headerRow = i; break;
          }
        }
        if(headerRow < 0) return null;

        const days = {1:[], 2:[], 3:[]};
        const groups = {1:{}, 2:{}, 3:{}};
        for(let r = headerRow+1; r < rows.length; r++){
          const row = rows[r];
          const day = parseInt(row[0]);
          if(![1,2,3].includes(day)) continue;
          const group  = String(row[1]||'').trim();
          const name   = String(row[2]||'').trim();
          const sets   = parseInt(row[3]) || 3;
          const reps   = String(row[4]||'10-12').trim();
          const page   = String(row[5]||'').trim();
          const note   = String(row[6]||'').trim();
          if(!name) continue;
          const isTime = reps.includes('сек') || note.includes('час');
          const isBody = note.includes('власна вага') || note.includes('bodyweight');
          if(!groups[day][group]) groups[day][group] = [];
          groups[day][group].push({name, sets, reps, page: page||undefined, isTime: isTime||undefined, bodyweight: isBody||undefined, note: note||undefined});
        }

        return [1,2,3].map(dayNum => ({
          id: 'd' + dayNum,
          label: 'День ' + dayNum,
          groups: Object.entries(groups[dayNum]).map(([label, items]) => ({label, items})),
        }));
      }

      const manDays = parseSheet('Чоловік');

      if(!manDays){
        showToast('Помилка: аркуш "Чоловік" не знайдено');
        return;
      }

      localStorage.setItem('custom-plan-man', JSON.stringify(manDays));

      loadCustomPlans();
      currentDay = 0;
      pendingSets = {};
      savedThisSession = {};
      checkedState = {};
      lastLogs = {};
      loadLastLogs().then(renderAll);
      showToast('✅ План завантажено!');
    }catch(err){
      console.error(err);
      showToast('Помилка читання файлу: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function loadCustomPlans(){
  const man = localStorage.getItem('custom-plan-man');
  if(man){
    try{
      const parsed = JSON.parse(man);
      DAYS_MAN.length = 0;
      parsed.forEach(d => DAYS_MAN.push(d));
    }catch(e){}
  }
}
