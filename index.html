  'Шраги зі штангою': 'https://www.youtube.com/watch?v=cJRVVx6ZvOg',

  'Велосипед': 'https://www.youtube.com/watch?v=9FGilxCbdz8',
  'Молитва (блочний прес)': 'https://www.youtube.com/watch?v=Q_WK2wB3ZJU',
  'Вакуум': 'https://www.youtube.com/watch?v=ZIF6VXaHpMI'
};

// ===== ФУНКЦІЯ ОТРИМАННЯ ВІДЕО =====
function getVideoUrl(name){
  if(VIDEO_TUTORIALS[name]) return VIDEO_TUTORIALS[name];
  
  const keywords = name.split(' (')[0];
  for(const [key, url] of Object.entries(VIDEO_TUTORIALS)){
    if(key.includes(keywords) || keywords.includes(key)){
      return url;
    }
  }
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(name + ' техніка виконання');
}

// ===== ФУНКЦІЯ ВИДАЛЕННЯ ЗАМІНИ =====
function clearAlt(id){
  if(pendingSets[id+'::alt']){
    delete pendingSets[id+'::alt'];
    renderMain();
    showToast('✅ Заміну видалено');
  }
}

// ... ВЕСЬ ІНШИЙ КОД ЯК РАНІШЕ ...

// ===== В renderMain() ЗМІНЮЄМО БЛОК ІЗ ЗАМІНОЮ =====
// Знайдіть в коді місце де створюється altSel і замініть на:

// ===== ЗАМІНА ВПРАВИ (з кнопкою видалення) =====
const altWrapper = document.createElement('div');
altWrapper.className = 'alt-wrapper';

const altSel = document.createElement('select');
altSel.className = 'alt-select';

const defOpt = document.createElement('option');
defOpt.value = '';
defOpt.textContent = '🔄 Заміна: оберіть іншу вправу';
defOpt.disabled = true;
defOpt.selected = !(pendingSets[id+'::alt'] || {}).raw;
altSel.appendChild(defOpt);

for (const [group, exercises] of Object.entries(ALL_EXERCISES)) {
  const optgroup = document.createElement('optgroup');
  optgroup.label = group;
  
  exercises.forEach(exName => {
    const opt = document.createElement('option');
    opt.value = exName;
    opt.textContent = exName;
    if ((pendingSets[id+'::alt'] || {}).raw === exName) opt.selected = true;
    optgroup.appendChild(opt);
  });
  
  altSel.appendChild(optgroup);
}

const customOpt = document.createElement('option');
customOpt.value = '__custom__';
customOpt.textContent = '✏️ Своя вправа (вписати)...';
altSel.appendChild(customOpt);

altSel.onchange = (e)=>{
  if(e.target.value === '__custom__'){
    const custom = prompt('Введіть назву вправи:');
    if(custom && custom.trim()){
      if(!pendingSets[id+'::alt']) pendingSets[id+'::alt'] = {};
      pendingSets[id+'::alt'].raw = custom.trim();
      const newOpt = document.createElement('option');
      newOpt.value = custom.trim();
      newOpt.textContent = custom.trim();
      newOpt.selected = true;
      altSel.insertBefore(newOpt, customOpt);
    }else{
      altSel.value = (pendingSets[id+'::alt'] || {}).raw || '';
    }
  }else{
    if(!pendingSets[id+'::alt']) pendingSets[id+'::alt'] = {};
    pendingSets[id+'::alt'].raw = e.target.value;
  }
};

altWrapper.appendChild(altSel);

// Кнопка видалення заміни
const clearBtn = document.createElement('button');
clearBtn.className = 'clear-alt-btn';
clearBtn.textContent = '✕';
clearBtn.title = 'Видалити заміну';
clearBtn.onclick = (e) => {
  e.stopPropagation();
  clearAlt(id);
};
altWrapper.appendChild(clearBtn);

card.appendChild(altWrapper);

// ===== КНОПКА "▶" З ВІДЕО =====
const vid = document.createElement('a');
vid.className = 'icon-btn';
vid.href = getVideoUrl(it.name);
vid.target = '_blank';
vid.textContent = '▶';
vid.title = 'Відео-туторіал';
actions.appendChild(vid);

// ... ВЕСЬ ІНШИЙ КОД ...
</script>
